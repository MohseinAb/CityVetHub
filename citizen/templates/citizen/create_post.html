{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h3 class="card-title fw-bold mb-4">Create a New Thread</h3>
                <form method="POST">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'citizen:community_feed' %}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-success px-4">Post Thread</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
