{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 border-top border-4 border-info">
            <div class="card-header bg-white py-3 text-center">
                <h4 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-person-plus text-info me-2"></i> Create Account
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{% url 'accounts:register' %}">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary-custom fw-bold py-2">Register</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light py-3 text-center border-0">
                <span class="text-muted small">Already have an account?</span> 
                <a href="{% url 'login' %}" class="fw-bold text-info text-decoration-none small ms-1">Sign in here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
